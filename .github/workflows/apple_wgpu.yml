name: Apple WebGPU
on:
  push:
    branches: [wgpu]
  workflow_dispatch:
permissions:
  contents: read

# The WebGPU painter is the default on macOS and iOS, where it presents through
# Metal. Nothing else here runs it on Apple hardware: platform tests use
# no_glfw and mobile tests run on Linux.
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build, WebGPU and GL
        run: |
          go build ./...
          go build -tags gl ./...

      - name: Metal painter against the software painter
        run: go test -v -run 'TestUniformsMatchShaders|TestPainterMatchesSoftware' ./internal/painter/webgpu/
        env:
          WGPU_DUMP: ${{ runner.temp }}/dump

      - name: fyne_demo window
        if: always()
        run: |
          go build -o demo ./cmd/fyne_demo
          ./demo > demo.log 2>&1 &
          sleep 15
          screencapture -x macos.png || true
          kill $! || true
          cat demo.log

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: macos
          path: |
            ${{ runner.temp }}/dump
            macos.png
            demo.log
          if-no-files-found: ignore

  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      # fyne package needs a provisioning profile for ios, so build the
      # executable with the simulator SDK and bundle it by hand. The GL build
      # runs too, to tell a WebGPU problem from a simulator one.
      - name: Build fyne_demo for the simulator, WebGPU and GL
        run: |
          SDK=$(xcrun -sdk iphonesimulator --show-sdk-path)
          export CGO_ENABLED=1 GOOS=ios GOARCH=arm64
          export CC="$(xcrun -sdk iphonesimulator -f clang) -isysroot $SDK -target arm64-apple-ios15.0-simulator"
          cat > Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>BUNDLE_ID</string>
            <key>CFBundleExecutable</key><string>Demo</string>
            <key>CFBundleName</key><string>Demo</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneSimulator</string></array>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
            <key>UILaunchScreen</key><dict/>
          </dict>
          </plist>
          EOF
          bundle() { # bundle NAME BUNDLE_ID TAGS
            mkdir -p "$1.app"
            go build -tags "$3" -o "$1.app/Demo" ./cmd/fyne_demo
            sed "s/BUNDLE_ID/$2/" Info.plist > "$1.app/Info.plist"
            codesign --force --sign - "$1.app"
          }
          bundle Demo io.fyne.demo ""
          bundle DemoGL io.fyne.demogl gl

      - name: Run in the simulator
        run: |
          UDID=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/ {print $2; exit}')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          for app in Demo:io.fyne.demo DemoGL:io.fyne.demogl; do
            name=${app%%:*} id=${app##*:}
            xcrun simctl install "$UDID" "$name.app"
            xcrun simctl launch --console "$UDID" "$id" > "$name.log" 2>&1 &
            sleep 25
            xcrun simctl io "$UDID" screenshot "$name.png"
            xcrun simctl terminate "$UDID" "$id" || true
            sleep 2
          done
          xcrun simctl spawn "$UDID" log show --last 10m --style compact --predicate 'process == "Demo"' > syslog.txt || true
          cp ~/Library/Logs/DiagnosticReports/Demo* . 2>/dev/null || true
          tail -n 40 Demo.log DemoGL.log

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-simulator
          path: |
            Demo*.png
            Demo*.log
            Demo*.ips
            syslog.txt
          if-no-files-found: ignore
